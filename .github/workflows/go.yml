name: tinvest-mcp workflow

on:
  push:
    branches: [ "main", "add-github-actions" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    - name: Set up vendor
      run: go mod vendor

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -shuffle=on -timeout=3m ./...
